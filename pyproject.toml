[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "Per-launch accounting for LLM inference on GPUs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "ZacharyZcR"}]
requires-python = ">=3.9"
keywords = ["cuda", "gpu", "llm", "profiling", "vllm", "cupti", "perfetto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Profiling",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/sec4si/ledger"
Repository = "https://github.com/sec4si/ledger"
Issues = "https://github.com/sec4si/ledger/issues"

[project.optional-dependencies]
dataflow = ["numpy"]

[project.scripts]
ledger = "ledger.cli:main"

[project.entry-points."vllm.general_plugins"]
ledger = "ledger.vllm_plugin:register"

[project.entry-points."sglang.srt.plugins"]
ledger = "ledger.sglang_plugin:register"

[tool.setuptools]
packages = ["ledger", "ledger._capture", "ledger._access", "ledger._bench", "ledger._examples"]

[tool.setuptools.package-dir]
"ledger._capture" = "capture"
"ledger._access" = "access"
"ledger._bench" = "bench"
"ledger._examples" = "examples"

[tool.setuptools.package-data]
"ledger._capture" = ["Makefile", "ledger_cupti.cc"]
"ledger._access" = ["Makefile", "tracer.cpp", "access.h", "patches.cu"]
"ledger._bench" = ["bwtest.cu", "flops.py"]
"ledger._examples" = ["vllm_decode.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
