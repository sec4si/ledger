name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check c++filt
        run: command -v c++filt
      - name: Install dependencies
        run: python -m pip install pytest numpy
      - name: Run tests
        run: python -m pytest tests
